[project]
name = "brasa"
version = "0.1.0"
description = "Harmonized MODIS + VIIRS active-fire calendar for Brazil (NASA Space Apps 2026)"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.1.3",
  "pandas==2.2.3",
  "numpy==2.1.3",
  "pyarrow==18.1.0",
  "geopandas==1.0.1",
  "shapely==2.0.6",
  "scipy==1.14.1",
  "statsmodels==0.14.4",
  "pymannkendall==1.4.3",
  "geobr==0.2.2",
  "matplotlib==3.9.3",
  "topojson==1.9",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["pipeline"]
